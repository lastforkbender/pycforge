name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the normal package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==82.0.1 wheel==0.47.0 pytest==9.1.1
          python -m pip install .
      - name: Prove the base install contains PyQt5
        run: |
          python -c "from importlib.metadata import requires; assert requires('pycforge') == ['PyQt5<6,>=5.15.11']"
          python -c "import PyQt5; from pycforge.ide import QT_AVAILABLE; assert QT_AVAILABLE"
          python -m pip check
      - name: Run the repository suite with real offscreen Qt
        run: python -m pytest -q

  distributions:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 twine==6.2.0 setuptools==82.0.1 wheel==0.47.0
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          python -m build
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python tools/normalize_sdist.py dist/pycforge-0.15.2.tar.gz
          python -m twine check --strict dist/*
          python tools/verify_public_distribution.py dist
      - name: Clean-install and construct the desktop workspace
        run: |
          python -m venv /tmp/pycforge-clean-install
          /tmp/pycforge-clean-install/bin/python -m pip install dist/pycforge-0.15.2-py3-none-any.whl
          /tmp/pycforge-clean-install/bin/python -m pip check
          /tmp/pycforge-clean-install/bin/python -c "import PyQt5; from pycforge.ide import QT_AVAILABLE; assert QT_AVAILABLE"
          /tmp/pycforge-clean-install/bin/python -c "from PyQt5.QtWidgets import QApplication; from pycforge.ide.qt import MainWindow; app=QApplication.instance() or QApplication([]); window=MainWindow(); window.show(); app.processEvents(); window.close(); app.processEvents()"
          /tmp/pycforge-clean-install/bin/pycforge --help
