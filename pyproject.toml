[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pycforge"
version = "0.15.2"
description = "Deterministic bounded Python-to-C source transpiler"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PyQt5>=5.15.11,<6"]
keywords = ["python", "c", "transpiler", "pyqt5", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[tool.setuptools.packages.find]
include = ["pycforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pycforge = "pycforge.laboratory.cli:main"

[project.gui-scripts]
pycforge-workspace = "pycforge.ide.qt:run"

[project.urls]
Homepage = "https://github.com/lastforkbender/pycforge"
Repository = "https://github.com/lastforkbender/pycforge"
Issues = "https://github.com/lastforkbender/pycforge/issues"
Changelog = "https://github.com/lastforkbender/pycforge/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
"pycforge.ide" = ["resources/icons/*.svg"]
